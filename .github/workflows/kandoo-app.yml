name: Kandoo App

on:
  push:
    paths:
      - 'src/Kandoo.App/**'
      - 'src/Kandoo.Core/JalaliDateConverter.cs'
      - 'tests/Kandoo.App.Tests/**'
      - 'docs/DECISIONS.md'
      - 'docs/reports/C-40.md'
      - 'docs/reports/C-41.md'
      - 'docs/reports/C-50.md'
      - 'scripts/Invoke-KandooApp.ps1'
      - 'scripts/Inspect-KandooApk.py'
      - 'scripts/Invoke-C50AndroidSmoke.sh'
      - '.github/workflows/kandoo-app.yml'
  pull_request:
    paths:
      - 'src/Kandoo.App/**'
      - 'src/Kandoo.Core/JalaliDateConverter.cs'
      - 'tests/Kandoo.App.Tests/**'
      - 'docs/DECISIONS.md'
      - 'docs/reports/C-40.md'
      - 'docs/reports/C-41.md'
      - 'docs/reports/C-50.md'
      - 'scripts/Invoke-KandooApp.ps1'
      - 'scripts/Inspect-KandooApk.py'
      - 'scripts/Invoke-C50AndroidSmoke.sh'
      - '.github/workflows/kandoo-app.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  test-and-build:
    name: App tests + Windows + Android
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI workloads
        shell: pwsh
        run: scripts/Invoke-CiStep.ps1 -StepName 'Install MAUI workloads' -ScriptPath scripts/Invoke-KandooApp.ps1 -ScriptArguments @('-Mode', 'Workload', '-ArtifactDirectory', 'artifacts')

      - name: Test app logic
        shell: pwsh
        run: scripts/Invoke-CiStep.ps1 -StepName 'Test app logic' -ScriptPath scripts/Invoke-KandooApp.ps1 -ScriptArguments @('-Mode', 'Test', '-ArtifactDirectory', 'artifacts')

      - name: Publish self-contained Windows app and zip
        shell: pwsh
        run: scripts/Invoke-CiStep.ps1 -StepName 'Publish self-contained Windows app and zip' -ScriptPath scripts/Invoke-KandooApp.ps1 -ScriptArguments @('-Mode', 'Windows', '-ArtifactDirectory', 'artifacts')

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-app-c50-win-x64
          path: artifacts/kandoo-app-c50-win-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build Android Debug APK
        shell: pwsh
        run: scripts/Invoke-CiStep.ps1 -StepName 'Build Android Debug APK' -ScriptPath scripts/Invoke-KandooApp.ps1 -ScriptArguments @('-Mode', 'Android', '-ArtifactDirectory', 'artifacts')

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-app-c50-android-debug-apk
          path: artifacts/kandoo-app-c50-android-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-emulator-smoke:
    name: Android 10 emulator launch + 15s liveness
    runs-on: ubuntu-latest
    needs: test-and-build
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Android test APK
        uses: actions/download-artifact@v4
        with:
          name: kandoo-app-c50-android-debug-apk
          path: artifacts

      - name: Inspect APK managed payload
        run: python3 scripts/Inspect-KandooApk.py artifacts/kandoo-app-c50-android-debug.apk artifacts/apk-inspection.json

      - name: Upload APK inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-app-c50-apk-inspection
          path: artifacts/apk-inspection.json
          if-no-files-found: error
          retention-days: 7

      - name: Launch on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/Invoke-C50AndroidSmoke.sh artifacts/kandoo-app-c50-android-debug.apk artifacts/emulator

      - name: Upload emulator logcat and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-app-c50-emulator-evidence
          path: artifacts/emulator
          if-no-files-found: error
          retention-days: 7
