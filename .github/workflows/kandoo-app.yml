name: Kandoo App

on:
  push:
    paths:
      - 'src/Kandoo.App/**'
      - 'src/Kandoo.Core/JalaliDateConverter.cs'
      - 'tests/Kandoo.App.Tests/**'
      - 'docs/DECISIONS.md'
      - 'docs/reports/C-40.md'
      - 'docs/reports/C-41.md'
      - 'docs/reports/C-50.md'
      - 'docs/reports/C-58.md'
      - 'scripts/Invoke-KandooApp.ps1'
      - 'scripts/Inspect-KandooApk.py'
      - 'scripts/Invoke-C50AndroidSmoke.sh'
      - 'scripts/Inspect-C58Evidence.py'
      - '.github/workflows/kandoo-app.yml'
  pull_request:
    paths:
      - 'src/Kandoo.App/**'
      - 'src/Kandoo.Core/JalaliDateConverter.cs'
      - 'tests/Kandoo.App.Tests/**'
      - 'docs/DECISIONS.md'
      - 'docs/reports/C-40.md'
      - 'docs/reports/C-41.md'
      - 'docs/reports/C-50.md'
      - 'docs/reports/C-58.md'
      - 'scripts/Invoke-KandooApp.ps1'
      - 'scripts/Inspect-KandooApk.py'
      - 'scripts/Invoke-C50AndroidSmoke.sh'
      - 'scripts/Inspect-C58Evidence.py'
      - '.github/workflows/kandoo-app.yml'
  workflow_dispatch:

# Same reason as ci.yml: a superseded push should not keep a windows-latest runner busy.
concurrency:
  group: kandoo-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  test-and-build:
    name: App tests + Windows + Android
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: ./.github/actions/kandoo-nuget-cache
        with:
          suffix: app

      - name: Install MAUI workloads
        shell: pwsh
        run: scripts/Invoke-CiStep.ps1 -StepName 'Install MAUI workloads' -ScriptPath scripts/Invoke-KandooApp.ps1 -ScriptArguments @('-Mode', 'Workload', '-ArtifactDirectory', 'artifacts')

      - name: Test app logic
        shell: pwsh
        run: scripts/Invoke-CiStep.ps1 -StepName 'Test app logic' -ScriptPath scripts/Invoke-KandooApp.ps1 -ScriptArguments @('-Mode', 'Test', '-ArtifactDirectory', 'artifacts')

      - name: Publish self-contained Windows app and zip
        shell: pwsh
        run: scripts/Invoke-CiStep.ps1 -StepName 'Publish self-contained Windows app and zip' -ScriptPath scripts/Invoke-KandooApp.ps1 -ScriptArguments @('-Mode', 'Windows', '-ArtifactDirectory', 'artifacts')

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-app-c50-win-x64
          path: artifacts/kandoo-app-c50-win-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build Android Debug APK
        shell: pwsh
        run: scripts/Invoke-CiStep.ps1 -StepName 'Build Android Debug APK' -ScriptPath scripts/Invoke-KandooApp.ps1 -ScriptArguments @('-Mode', 'Android', '-ArtifactDirectory', 'artifacts')

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-app-c50-android-debug-apk
          path: artifacts/kandoo-app-c50-android-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build Android Release APK (C-59)
        shell: pwsh
        run: scripts/Invoke-CiStep.ps1 -StepName 'Build Android Release APK' -ScriptPath scripts/Invoke-KandooApp.ps1 -ScriptArguments @('-Mode', 'AndroidRelease', '-ArtifactDirectory', 'artifacts')

      - name: Upload Android Release APK and certificate (C-59)
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-app-c59-android-release-apk
          path: |
            artifacts/kandoo-app-c59-android-release.apk
            artifacts/kandoo-app-c59-release-keystore-cert.txt
          if-no-files-found: error
          retention-days: 7

# C-90 / M-013 §4: the `android-emulator-smoke` job was deleted here. It ran an Android 10
# (API 29) AVD on ubuntu-latest, booted it, launched the app and sampled a 15 s liveness window.
# It never once passed: the emulator never finished booting inside the runner's budget, so the
# job sat until the workflow was cancelled and reported a timeout on every run. Three separate
# fix attempts (hardware acceleration, snapshot boot, longer boot budget) did not change that.
# Its acceptance intent is covered without an emulator:
#   - the signed release APK is built and uploaded further up (kandoo-app-c59-android-release-apk,
#     plus the keystore certificate fingerprint), which is the D2 store artefact;
#   - app logic is covered by Kandoo.App.Tests in the "Test app logic" step;
#   - on-device launch is the PO's J8 manual test, recorded as such rather than faked in CI.
