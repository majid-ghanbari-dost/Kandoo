name: C-58 Diagnostic Evidence

on:
  push:
    paths:
      - '.github/workflows/c58-diagnose.yml'
      - 'scripts/Inspect-C58Evidence.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-uploaded-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic script
        uses: actions/checkout@v4
      - name: Download current UI and logcat evidence
        uses: actions/download-artifact@v4
        with:
          name: kandoo-app-c50-emulator-evidence
          path: current
          run-id: 41860723500
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download previous logcat evidence
        uses: actions/download-artifact@v4
        with:
          name: kandoo-app-c50-emulator-evidence
          path: previous
          run-id: 41858265612
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Annotate UI and crash evidence
        run: python3 scripts/Inspect-C58Evidence.py current=current previous=previous
