name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Kandoo.sln

      - name: Build
        run: dotnet build Kandoo.sln --configuration Release --no-restore

      - name: Test and write TRX
        run: dotnet test Kandoo.sln --configuration Release --no-build --results-directory tests/Kandoo.Core.Tests/TestResults --logger "trx;LogFileName=test-results.trx"

      - name: Publish failed test annotations
        if: always()
        shell: pwsh
        run: |
          $resultFiles = Get-ChildItem -Path tests/Kandoo.Core.Tests/TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $resultFiles) {
            [xml]$trx = Get-Content -LiteralPath $file.FullName
            foreach ($result in @($trx.TestRun.Results.UnitTestResult)) {
              if ($null -ne $result -and $result.outcome -ne 'Passed') {
                $message = [string]$result.Output.ErrorInfo.Message
                $message = $message -replace "[`r`n]+", " "
                Write-Host "::error::$($result.testName): $message"
              }
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/Kandoo.Core.Tests/TestResults/*.trx
          if-no-files-found: error
