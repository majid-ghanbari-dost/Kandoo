  /v1/pairing-grants/{pairing_id}/consume:
    post:
      tags:
      - Device Pairing
      operationId: consumePairingGrant
      summary: Consume QR pairing and issue a device token
      description: Called by the active Hub after the companion consumed the Hub-generated QR over LAN and the Hub committed device.pair. Cloud validates the registered grant fingerprints and Hub-authored entry, ingests atomically (or recognizes an exact duplicate), consumes the Cloud grant record, and issues the companion token. QR expiry is evaluated against the authoritative Hub pairing outcome, not Cloud receipt time, so delayed replication remains valid. It never grants HUB role or a LAN session.
      parameters:
      - $ref: '#/components/parameters/PairingId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Consume QR pairing and issue a device token success.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingConsumeResponse'
        '400':
