  /v1/stores/{store_id}/operation-batches:
    post:
      tags:
      - Operation Ingest
      operationId: ingestOperationBatch
      summary: Append an ordered Hub operation batch
      description: Atomically validates active writer epoch, batch completeness, contiguous ascending sequences, request/entry hashes, operation identity, and store scope. Writer fencing is evaluated first, including for an empty batch, so a stale writer receives WRITER_FENCED as required by CLOUD-008. An active writer submitting zero entries receives INCOMPLETE_BATCH with no effects. Exact duplicate prefixes are acknowledged; gaps and conflicts apply no partial suffix. Idempotency-Key must equal batch_id.
      parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Append an ordered Hub operation batch success.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
