  /v1/stores/{store_id}/devices/{device_id}/revoke:
    post:
      tags:
      - Device Pairing
      operationId: revokeDevice
      summary: Revoke a device and its Cloud credential
      description: Accepts the active Hub-authored device.revoke entry for a COMPANION, applies ordered ingest semantics, revokes Cloud tokens/sessions, and projects owned-lock releases as DISCONNECT. Historical operations and locks are retained. HUB targets return FORBIDDEN; replacement requires authorized restore. Emergency token compromise uses revocation, not rotation.
      parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
