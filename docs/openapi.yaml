    post:
      tags:
      - Store Registration
      operationId: registerStore
      summary: Register a store and allocate store_id
      description: Consumes STORE_REGISTRATION OTP proof and a digital acceptance of the configured lawyer-approved onboarding agreement, then atomically creates Business, Store, owner User/Membership, initial HUB Device, writer epoch 1, and its per-device credential. Missing approved agreement configuration returns LEGAL_COPY_UNAVAILABLE; invalid acceptance returns VALIDATION_ERROR with no effects. This is the only bootstrap before a Hub exists; subsequent domain writes are Hub-authored.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Register a store and allocate store_id success.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
