components:
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Per-device, store-bound opaque token. Active HUB tokens alone authorize replicated domain mutations; companion
        tokens never do.
    RestoreBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Short-lived token bound to restore_request_id, replacement device, and manifest state_hash after OTP plus
        second factor.
  parameters:
    StoreId:
      name: store_id
      in: path
      required: true
      schema: &id005
        type: string
        format: uuid
      description: Mandatory tenant scope.
    ChallengeId:
      name: challenge_id
      in: path
      required: true
      schema: &id004
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._~-]{0,127}$
      description: OTP challenge identifier.
    PairingId:
      name: pairing_id
      in: path
      required: true
      schema: *id004
      description: Single-use pairing grant identifier.
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: *id005
      description: Store-scoped device identifier.
    LockId:
      name: lock_id
      in: path
      required: true
      schema: *id005
