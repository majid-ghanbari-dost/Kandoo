  /v1/stores/{store_id}/pairing-grants:
    post:
      tags:
      - Device Pairing
      operationId: createPairingGrant
      summary: Register a Hub-generated QR pairing grant
      description: Called by the active Hub for an active OWNER after the Hub generates the QR secret locally. Cloud registers only pairing metadata and SHA-256 fingerprints; the raw nonce and QR generation remain on the Hub. The default lifetime is 300 seconds. Registration may replicate late after a WAN outage and is not a prerequisite for Hub-local LAN pairing.
      parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/IdempotencyKey'
