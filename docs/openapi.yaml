      - SERVICE_UNAVAILABLE
      - INTERNAL_ERROR
      x-rate-limit:
        limit: 10
        window_seconds: 900
        scope: challenge + source IP
      x-domain-decisions:
      - D4
      - SEC-1
      requestBody:
        required: true
        content:
