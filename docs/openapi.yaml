        window_seconds: 3600
        scope: verification token + source IP
      x-domain-decisions:
      - D6
      - D7
      - D10
      - D11
      - D14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRegistrationRequest'
      security: *id002
