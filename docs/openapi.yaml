# KANDOO P-04 — DOCUMENTATION-ONLY OPENAPI 3.1 CONTRACT
# Normative narrative: docs/cloud-api-contract.md
# No implementation, credentials, production host, or live SMS behavior is claimed.
openapi: 3.1.0
info:
  title: Kandoo Cloud API
  version: 1.0.0
  summary: P-04 documentation-only contract for Hub replication, administration, restore, and invoice delivery.
  description: Normative HTTP contract for P-05/P-07 and downstream P-06/P-08/P-09 implementation, including the owner-approved
    P-0104r pre-implementation revision. It does not claim an implemented service. Store Hub authority, P-02 canonical hashes,
    strict store isolation, SEC-1 restore second factor, SMS stub, lawyer-copy gates, issue-only display numbering, accepted-change-only
    lock activity, and ASM-22 scaled quantities are mandatory. Path version /v1 is independent of kandoo.sync.v0 and Canonical Invoice v0.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.kandoo.invalid
  description: Non-routable documentation origin; deployment selects the real origin later.
tags:
- name: Store Registration
  description: Owner OTP verification, store_id allocation, and initial Hub bootstrap.
- name: Device Pairing
  description: Owner/Hub QR grants, Hub-authored pairing, device tokens, listing, revocation, and rotation.
- name: Operation Ingest
  description: Ordered atomic append-only Hub log replication and cursor reads.
- name: Locks
  description: Cloud-replica D11 lock queries and active-Hub release entries.
- name: Restore
  description: OTP plus second factor, manifest/log replay, consistency verification, and writer activation.
- name: Invoice Delivery
  description: SMS stub, QR/share links, and anonymous single-invoice public-token view.
security:
- DeviceBearer: []
paths:
  /v1/otp/challenges:
    post:
      tags:
      - Store Registration
      operationId: requestOtpChallenge
      summary: Request an owner OTP challenge
      description: Creates an SMS OTP challenge for STORE_REGISTRATION or RESTORE. The v1 provider is a deterministic stub
        for local synthetic use; it never makes an external call and cannot enable production authentication.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Request an owner OTP challenge success.
          headers: &id001
            RateLimit-Limit: &id006
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining: &id007
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset: &id008
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
      - VALIDATION_ERROR
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_CONFLICT
      - RATE_LIMITED
      - SMS_PROVIDER_NOT_CONFIGURED
      - SERVICE_UNAVAILABLE
      - INTERNAL_ERROR
      x-rate-limit:
        limit: 5
        window_seconds: 900
        scope: normalized phone + source IP + purpose
      x-domain-decisions:
      - D4
      - SEC-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpChallengeRequest'
      security: &id002 []
  /v1/otp/challenges/{challenge_id}/verify:
    post:
      tags:
      - Store Registration
      operationId: verifyOtpChallenge
      summary: Verify an owner OTP challenge
      description: Verifies the code and returns a short-lived, single-use verification token bound to phone, purpose, and
        store. OTP alone never authorizes restore export.
      parameters:
      - $ref: '#/components/parameters/ChallengeId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Verify an owner OTP challenge success.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
      - VALIDATION_ERROR
      - IDEMPOTENCY_KEY_REQUIRED
      - OTP_INVALID
      - OTP_EXPIRED
      - IDEMPOTENCY_CONFLICT
      - RATE_LIMITED
